name: Publish to npm

# Publishes when the version in package.json is not on npm yet (pushes to main).
# Trusted publishing (SEC-223): npm accepts the GitHub OIDC token of this workflow,
# so there is no npm token in the repository; provenance is attached automatically.
# npmjs.com: package settings -> Trusted publisher: GitHub Actions,
# Mailbutler/<repository>, workflow publish.yml
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC token for npm

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing needs GitHub-hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in release builds
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish if this version is not on npm yet
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            npm publish --access public
          fi
